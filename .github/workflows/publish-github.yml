name: Publish to GitHub Packages

# docs/RELEASING.md describes what this does; scripts/release/plan.mjs decides it.
#
# Security: workflow_run's `branches: master` filter matches the *head branch name*,
# so a fork PR from a branch called "master" would trigger it. Every job therefore
# only accepts runs started by a push to this repository. Values from events reach
# scripts through `env` only.
on:
  workflow_run:
    workflows: ["test", "format"]
    types:
      - completed
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "packages/openauth/**"
      - "scripts/release/**"
      - ".github/workflows/publish-github.yml"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto: from the commits; also finishes a half-done release)"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

permissions:
  contents: read

jobs:
  # Publish only a commit of master on which BOTH test and format passed. The workflow
  # that finishes first finds the other still running and stops here; the second goes on.
  gate:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      # PRs: the merge of the head into the base, what master would be
      - name: Wait for checks to pass
        if: github.event_name == 'pull_request'
        uses: lewagon/wait-on-check-action@ccfb013c15c8afb7bf2b7c028fb74dc5a068cccc # v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          check-regexp: ^(test|format)$

      - name: Both checks passed on the commit?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          ready=true
          if [ "$EVENT" != pull_request ]; then
            for workflow in test format; do
              conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow.yml/runs?head_sha=$SHA&event=push&branch=master&per_page=1" \
                --jq '.workflow_runs[0] | if . == null then "missing" elif .status == "completed" then .conclusion else .status end')
              echo "$workflow on ${SHA::7}: $conclusion"
              [ "$conclusion" = success ] || ready=false
            done
            [ "$ready" = true ] || echo "::notice::Not publishing ${SHA::7}: test and format have not both passed on it (yet)."
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    # One publish at a time, so two merges never pick the same version. PRs only queue
    # behind themselves.
    concurrency:
      group: publish-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'release' }}
      cancel-in-progress: false
    env:
      PACKAGE: "@al-ummah-now/openauth"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: On master?
        if: github.event_name != 'pull_request'
        run: git merge-base --is-ancestor HEAD origin/master

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@al-ummah-now"

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name == 'workflow_run' && 'release' || github.event_name == 'workflow_dispatch' && 'dispatch' || 'pr' }}
          SHA: ${{ needs.gate.outputs.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' > "$RUNNER_TEMP/releases.txt"
          node scripts/release/plan.mjs --event "$EVENT" --sha "$SHA" --base "$BASE" --pr "$PR" \
            --run "$GITHUB_RUN_NUMBER" --bump "$BUMP" --repository "$GITHUB_REPOSITORY" \
            --releases "$RUNNER_TEMP/releases.txt" --notes "$RUNNER_TEMP/release_notes.md" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.plan.outputs.skip != 'true'

      - name: Install and build
        if: steps.plan.outputs.skip != 'true'
        run: |
          bun install --frozen-lockfile
          bun run --filter="@openauthjs/openauth" build

      - name: Pack
        if: steps.plan.outputs.skip != 'true'
        id: pack
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        working-directory: packages/openauth
        run: |
          set -euo pipefail
          # package.json is upstream's metadata; package.github.json is what we publish
          node -e '
            const fs = require("fs")
            const pkg = JSON.parse(fs.readFileSync("package.github.json", "utf8"))
            pkg.version = process.env.VERSION
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n")
          '
          file=$(npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')
          echo "file=$RUNNER_TEMP/$file" >> "$GITHUB_OUTPUT"

      # The tag ties the version to this commit before anything is published. If a later
      # step fails, the next run for the commit finds the tag without a GitHub release and
      # finishes the same version (plan.mjs, "resume").
      - name: Tag
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            at=$(git rev-parse "$TAG^{commit}")
            [ "$at" = "$SHA" ] || { echo "::error::Tag $TAG is on $at, not $SHA; refusing to publish"; exit 1; }
            echo "$TAG is already on ${SHA::7}"
          else
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git tag -a "$TAG" -m "Release $TAG" "$SHA"
            git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG"
          fi

      - name: Publish
        if: steps.plan.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
          DIST_TAG: ${{ steps.plan.outputs.dist_tag }}
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          set -euo pipefail
          if published=$(npm view "$PACKAGE@$VERSION" version 2>/dev/null) && [ "$published" = "$VERSION" ]; then
            echo "$PACKAGE@$VERSION is already on the registry (an earlier run published it)"
          else
            npm publish "$FILE" --ignore-scripts --tag "$DIST_TAG"
          fi

      - name: GitHub release
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          PRERELEASE: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          args=(--title "$TAG" --notes-file "$RUNNER_TEMP/release_notes.md" --verify-tag)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease --title "$TAG (Pre-release)"); else args+=(--latest); fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" "${args[@]}"

      - name: Comment on PR
        if: steps.plan.outputs.skip != 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📦 Published prerelease to GitHub Packages!\n\n\`\`\`bash\nnpm install @al-ummah-now/openauth@${process.env.VERSION}\n\`\`\`\n\nThis is a prerelease version for testing. After merging, a stable version will be published.`
            })
