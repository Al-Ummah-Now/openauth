name: Publish to GitHub Packages

# Security: workflow_run's `branches: master` filter matches the *head branch name*,
# so a fork PR from a branch called "master" would trigger it. The publish job
# therefore only accepts runs started by a push to this repository.
on:
  # Run after other workflows complete on main
  workflow_run:
    workflows: ["test", "format"]
    types:
      - completed
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/openauth/**'
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# One publish per commit at a time: `test` and `format` both trigger a run for the
# same master commit, and the second must see the first's tag and skip.
concurrency:
  group: publish-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  # For PRs: wait for checks to pass first
  wait-for-checks:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Wait for checks to pass
        uses: lewagon/wait-on-check-action@ccfb013c15c8afb7bf2b7c028fb74dc5a068cccc # v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          running-workflow-name: 'wait-for-checks'
          check-regexp: ^(test|format)$

  publish:
    runs-on: ubuntu-latest
    needs: [wait-for-checks]
    if: |
      always() &&
      (needs.wait-for-checks.result == 'success' || needs.wait-for-checks.result == 'skipped') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    steps:

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@al-ummah-now"

      - name: Install dependencies
        run: bun install

      - name: Build package
        run: bun run --filter="@openauthjs/openauth" build

      - name: Determine version
        id: version
        run: |
          cd packages/openauth

          # The released version lives in the git tags, not in a commit on master:
          # master's ruleset requires a pull request, so this workflow never pushes
          # to it. Base = the newer of the latest stable tag and package.github.json.
          FILE_VERSION=$(node -e "console.log(require('./package.github.json').version)")
          TAG_VERSION=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | grep -ve '-' | head -1 | sed 's/^v//')
          CURRENT_VERSION=$(printf '%s\n%s\n' "$FILE_VERSION" "${TAG_VERSION:-0.0.0}" | sort -V | tail -1)
          echo "Current version: $CURRENT_VERSION (file $FILE_VERSION, tag ${TAG_VERSION:-none})"

          # A commit is released once: a second trigger for the same commit skips
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            RELEASED=$(git tag --points-at HEAD -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -ve '-' | head -1)
            if [ -n "$RELEASED" ]; then
              echo "HEAD is already released as $RELEASED; nothing to publish"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

          # Parse version components
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          PATCH=$(echo $CURRENT_VERSION | cut -d. -f3 | cut -d- -f1)

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR: prerelease version like 1.0.7-pr.5.123
            PR_NUMBER=${{ github.event.pull_request.number }}
            RUN_NUMBER=${{ github.run_number }}
            # Use next patch version for prereleases
            NEXT_PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-pr.${PR_NUMBER}.${RUN_NUMBER}"
            TAG="pr"
            SHOULD_UPDATE_VERSION="false"
            echo "Publishing PR prerelease: $VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual: bump based on input
            BUMP_TYPE="${{ github.event.inputs.bump }}"
            case $BUMP_TYPE in
              major)
                VERSION="$((MAJOR + 1)).0.0"
                ;;
              minor)
                VERSION="${MAJOR}.$((MINOR + 1)).0"
                ;;
              *)
                VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
                ;;
            esac
            TAG="latest"
            SHOULD_UPDATE_VERSION="true"
            echo "Publishing manual $BUMP_TYPE bump: $VERSION"
          else
            # Push to main after checks pass: auto bump patch
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            TAG="latest"
            SHOULD_UPDATE_VERSION="true"
            echo "Publishing release (auto patch bump): $VERSION"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "should_update=$SHOULD_UPDATE_VERSION" >> $GITHUB_OUTPUT

      - name: Prepare GitHub Packages release
        if: steps.version.outputs.skip != 'true'
        run: |
          cd packages/openauth
          # Backup original package.json
          cp package.json package.npm.json
          # Use GitHub Packages config
          cp package.github.json package.json
          # Set the computed version for publishing
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Package version: $(node -e "console.log(require('./package.json').version)")"

      - name: Generate release notes
        if: steps.version.outputs.skip != 'true'
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IS_PRERELEASE="${{ github.event_name == 'pull_request' }}"

          # Get the previous stable tag (skip pre-release tags)
          PREV_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-version:refname | grep -v "-" | head -1 || echo "")

          if [ "$IS_PRERELEASE" = "true" ]; then
            # For PRs, get commits in this PR
            PR_BASE="${{ github.event.pull_request.base.sha }}"
            PR_HEAD="${{ github.event.pull_request.head.sha }}"
            COMMITS=$(git log ${PR_BASE}..${PR_HEAD} --pretty=format:"- %s (%h)" --no-merges | grep -v "\[skip ci\]" || echo "")
            COMPARE_BASE="${{ github.event.pull_request.base.ref }}"
          else
            # For releases, get commits since last tag
            if [ -n "$PREV_TAG" ]; then
              COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges | grep -v "\[skip ci\]" || echo "")
              COMPARE_BASE="$PREV_TAG"
            else
              COMMITS=$(git log -20 --pretty=format:"- %s (%h)" --no-merges | grep -v "\[skip ci\]" || echo "")
              COMPARE_BASE=""
            fi
          fi

          # Categorize commits
          FEATURES=$(echo "$COMMITS" | grep -iE "^- (feat|feature)" || echo "")
          FIXES=$(echo "$COMMITS" | grep -iE "^- fix" || echo "")
          DOCS=$(echo "$COMMITS" | grep -iE "^- doc" || echo "")
          OTHER=$(echo "$COMMITS" | grep -ivE "^- (feat|feature|fix|doc|chore|refactor|style|test|ci|auto)" | grep -v "^$" || echo "")

          # Build release notes
          if [ "$IS_PRERELEASE" = "true" ]; then
            NOTES="## 🧪 Pre-release v${VERSION}\n\n"
            NOTES="${NOTES}> This is a pre-release from PR #${{ github.event.pull_request.number }}\n\n"
          else
            NOTES="## What's Changed in v${VERSION}\n\n"
          fi

          if [ -n "$FEATURES" ]; then
            NOTES="${NOTES}### ✨ Features\n${FEATURES}\n\n"
          fi

          if [ -n "$FIXES" ]; then
            NOTES="${NOTES}### 🐛 Bug Fixes\n${FIXES}\n\n"
          fi

          if [ -n "$DOCS" ]; then
            NOTES="${NOTES}### 📚 Documentation\n${DOCS}\n\n"
          fi

          if [ -n "$OTHER" ]; then
            NOTES="${NOTES}### 🔧 Other Changes\n${OTHER}\n\n"
          fi

          if [ -n "$COMPARE_BASE" ]; then
            NOTES="${NOTES}---\n\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/${COMPARE_BASE}...v${VERSION}"
          fi

          # Save to file to handle multiline
          echo -e "$NOTES" > release_notes.md
          cat release_notes.md
          echo "Generated release notes"

      - name: Create Git Tag
        if: steps.version.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG_NAME="v${VERSION}"

          # Tag before publishing: the tag is the record of the release (master is
          # never pushed to), so an existing tag means this version is taken.
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Tag $TAG_NAME already exists; refusing to publish over it"
            exit 1
          else
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
            echo "Created and pushed tag $TAG_NAME"
          fi

      - name: Publish to GitHub Packages
        if: steps.version.outputs.skip != 'true'
        run: |
          cd packages/openauth
          npm publish --tag ${{ steps.version.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore original package.json
        if: always()
        run: |
          cd packages/openauth
          if [ -f package.npm.json ]; then
            mv package.npm.json package.json
          fi

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = '${{ steps.version.outputs.version }}';
            const tagName = `v${version}`;
            const isPrerelease = '${{ github.event_name }}' === 'pull_request';

            // Read release notes
            let body = '';
            try {
              body = fs.readFileSync('release_notes.md', 'utf8');
            } catch (e) {
              body = `## Release v${version}\n\nPublished to GitHub Packages.`;
            }

            // Create the release
            try {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                name: isPrerelease ? `v${version} (Pre-release)` : `v${version}`,
                body: body,
                draft: false,
                prerelease: isPrerelease,
                target_commitish: '${{ github.sha }}'
              });
              console.log(`Created ${isPrerelease ? 'pre-release' : 'release'} ${tagName}`);
            } catch (error) {
              if (error.status === 422) {
                console.log(`Release ${tagName} already exists, skipping`);
              } else {
                throw error;
              }
            }

      - name: Comment on PR
        if: steps.version.outputs.skip != 'true' && (github.event_name == 'pull_request')
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📦 Published prerelease to GitHub Packages!\n\n\`\`\`bash\nnpm install @al-ummah-now/openauth@${{ steps.version.outputs.version }}\n\`\`\`\n\nThis is a prerelease version for testing. After merging, a stable version will be published.`
            })
