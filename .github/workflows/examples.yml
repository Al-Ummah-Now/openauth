name: examples

# The Python and Go examples against an issuer this job starts and stops.
on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "examples/client/python/**"
      - "examples/client/go/**"
      - "examples/test/**"
      - "packages/openauth/src/**"
      - ".github/workflows/examples.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/client/go/go.mod
          cache-dependency-path: examples/client/go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --disable-pip-version-check uv==0.13.9
      - run: bun install
      - run: test -z "$(gofmt -l examples/client/go)"
      - run: cd examples/client/go && go vet ./...
      - run: bun examples/test/run.ts
